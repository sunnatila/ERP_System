services:
  db:
    image: postgres:15-alpine
    container_name: stylehub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stylehub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stylehub-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - stylehub-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stylehub-frontend
    restart: unless-stopped
    ports:
      - "4000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stylehub-network

volumes:
  postgres_data:

networks:
  stylehub-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
